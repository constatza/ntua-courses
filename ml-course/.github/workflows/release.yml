name: Create GitHub release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up TeX Live
        run: |
          sudo apt-get update -y
          sudo apt-get install -y texlive-base texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-luatex latexmk

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install ntuabeamer class
        run: |
          curl -fsSL https://raw.githubusercontent.com/constatza/beamer-ntua/main/scripts/install-class.sh | sh

      - name: Build all decks
        run: sh tools/build-all

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CI: "true"
        run: sh tools/release.sh "${GITHUB_REF#refs/tags/}"
